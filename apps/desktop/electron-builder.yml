appId: com.raguiohead.sinapse
productName: Sinapse
electronVersion: 45.1.0
artifactName: "${productName}-${version}-${arch}.${ext}"

directories:
  output: dist
  buildResources: build

files:
  - out/**/*
  - package.json

asar: true
# The `sinapse` CLI shim runs @sinapse/cli as a plain node process, which cannot read inside app.asar:
# it and every runtime dependency (fastify, nanoid, ...) must live on disk.
asarUnpack:
  - "**/node_modules/**"

extraResources:
  - from: "../../skill/sinapse"
    to: "skill/sinapse"
  - from: "bin"
    to: "bin"

linux:
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  executableName: sinapse
  category: Development
  icon: build/icon.png
  synopsis: Orquestrador pessoal de agentes multiagente
  maintainer: "raguiohead <guilhermep_alves@hotmail.com>"

deb:
  packageName: sinapse
  maintainer: "raguiohead <guilhermep_alves@hotmail.com>"

win:
  target:
    - target: nsis
      arch:
        - x64
  executableName: Sinapse
  icon: build/icon.ico

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Sinapse

mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
  icon: build/icon.png
  category: public.app-category.developer-tools
  identity: null
  hardenedRuntime: false
  gatekeeperAssess: false
